<title>Alisios Med</title>
<meta name="description" content="App del paciente: registro, pedir medicación por dron, seguir el vuelo en vivo y confirmar la entrega." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
<style>
  :root{
    --sand:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFEBE1;
    --ink:#18272E; --ink-soft:#4C5C64; --line:#E2DCCF;
    --teal:#1E6E8C; --teal-deep:#134F62; --teal-tint:#E3EFF2;
    --sun:#D2833A; --sun-tint:#F7E7D4;
    --ok:#2E7D57; --warn:#9C6412; --crit:#B23B3B;
    --shadow:0 1px 2px rgba(20,40,48,.06), 0 8px 24px rgba(20,40,48,.08);
    --r:18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sand:#111A1E; --surface:#1A242A; --surface-2:#233139;
      --ink:#EEF2F1; --ink-soft:#9FB2B9; --line:#2F3F47;
      --teal:#57ADCB; --teal-deep:#2E86A3; --teal-tint:#16323B;
      --sun:#E19B58; --sun-tint:#382A1B;
      --ok:#5CBA8D; --warn:#D89F46; --crit:#D66C6C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.36);
    }
  }
  :root[data-theme="dark"]{
    --sand:#111A1E; --surface:#1A242A; --surface-2:#233139;
    --ink:#EEF2F1; --ink-soft:#9FB2B9; --line:#2F3F47;
    --teal:#57ADCB; --teal-deep:#2E86A3; --teal-tint:#16323B;
    --sun:#E19B58; --sun-tint:#382A1B;
    --ok:#5CBA8D; --warn:#D89F46; --crit:#D66C6C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.36);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  [hidden]{display:none!important}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:"Hanken Grotesk", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size:18px; line-height:1.5;
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh;
    padding:24px 16px 40px;
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

  .phone{
    width:100%; max-width:412px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:34px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex; flex-direction:column;
    min-height:772px;
    position:relative;
  }
  .demo-chip{
    position:absolute; top:14px; right:14px; z-index:20;
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--sun); background:var(--sun-tint);
    padding:5px 9px; border-radius:999px;
  }

  /* ---------- auth ---------- */
  .auth-body{padding:38px 28px 30px;display:flex;flex-direction:column;flex:1}
  .auth-hero{text-align:center;margin-bottom:26px}
  .mark{
    width:44px;height:44px;border-radius:13px;flex:none;
    background:var(--teal); color:#fff; display:grid;place-items:center;
  }
  .mark svg{width:26px;height:26px}
  .mark.lg{width:64px;height:64px;border-radius:19px;margin:0 auto 16px}
  .mark.lg svg{width:38px;height:38px}
  .wordmark{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:30px;letter-spacing:.01em;display:block}
  .auth-hero p{color:var(--ink-soft);font-size:16px;margin-top:6px;text-wrap:balance}
  .auth-h{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:24px;margin-bottom:6px}
  .auth-sub{color:var(--ink-soft);font-size:15px;margin-bottom:22px}
  .spacer{flex:1}

  .form-field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .form-field > span{font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .inp{
    width:100%;border:1.5px solid var(--line);border-radius:12px;
    padding:14px;font-size:16.5px;font-family:inherit;
    background:var(--surface);color:var(--ink);
  }
  .inp:focus{border-color:var(--teal);outline:none}
  .err{color:var(--crit);font-size:14px;margin:2px 0 12px;display:flex;gap:7px;align-items:flex-start}
  .err svg{width:17px;height:17px;flex:none;margin-top:1px}
  .hint{
    background:var(--teal-tint);border-radius:12px;padding:12px 14px;
    font-size:13.5px;color:var(--teal-deep);margin-bottom:18px;
  }
  .hint b{font-weight:700}
  .auth-alt{text-align:center;margin-top:16px;font-size:15px;color:var(--ink-soft)}

  /* shared */
  .topbar{
    padding:20px 20px 14px;
    display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .brand{flex:1;min-width:0}
  .brand b{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:18px;display:block;line-height:1.1}
  .brand span{font-size:12.5px;color:var(--ink-soft)}
  .icon-btn{
    border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);
    border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;flex:none;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--ink-soft)}

  .screen{padding:22px 22px 26px;flex:1;overflow-y:auto}
  .screen h1{
    font-family:"Fraunces",Georgia,serif; font-weight:500;
    font-size:27px; line-height:1.2; letter-spacing:.005em;
    text-wrap:balance; margin-bottom:6px;
  }
  .screen .lede{color:var(--ink-soft);font-size:16px;margin-bottom:20px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-deep);margin-bottom:10px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .card + .card{margin-top:14px}
  .stack{display:flex;flex-direction:column;gap:14px}

  .med{display:flex;align-items:flex-start;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}
  .med:last-child{border-bottom:0;padding-bottom:0}
  .med:first-child{padding-top:0}
  .med .pill-ico{width:34px;height:34px;border-radius:10px;flex:none;background:var(--teal-tint);display:grid;place-items:center;color:var(--teal-deep)}
  .med .pill-ico svg{width:19px;height:19px}
  .med b{font-size:17px;font-weight:600;display:block}
  .med small{color:var(--ink-soft);font-size:14px}
  .med .when{margin-left:auto;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .when.low{color:var(--crit)}
  .when.ok{color:var(--ok)}

  label.opt{
    display:flex;align-items:center;gap:14px;
    border:1.5px solid var(--line);border-radius:14px;
    padding:16px;cursor:pointer;background:var(--surface);
    transition:border-color .15s, background .15s;
  }
  label.opt:has(input:checked){border-color:var(--teal);background:var(--teal-tint)}
  label.opt:has(input:disabled){opacity:.55;cursor:not-allowed}
  label.opt input{width:24px;height:24px;flex:none;accent-color:var(--teal)}
  label.opt b{font-size:16.5px;font-weight:600;display:block}
  label.opt small{color:var(--ink-soft);font-size:13.5px}
  .opt .warn-tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.08em}

  button{font-family:inherit}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;border:0;border-radius:14px;
    padding:17px 18px;font-size:17.5px;font-weight:700;
    background:var(--teal);color:#fff;cursor:pointer;
    transition:filter .15s, transform .05s;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:var(--surface-2);color:var(--ink)}
  .btn.ghost{background:transparent;color:var(--teal-deep);border:1.5px solid var(--line)}
  .btn.sun{background:var(--sun)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn svg{width:20px;height:20px}
  .btn-row{display:flex;flex-direction:column;gap:11px;margin-top:18px}

  a.link,.linkbtn{color:var(--teal-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;font-size:inherit}

  .live-banner{
    display:flex;align-items:center;gap:13px;
    background:var(--teal-deep);color:#fff;
    border-radius:16px;padding:15px 16px;cursor:pointer;margin-bottom:20px;
  }
  .live-banner .dot{width:10px;height:10px;border-radius:50%;background:#fff;flex:none;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .live-banner b{display:block;font-size:15.5px}
  .live-banner small{opacity:.85;font-size:13px}
  .live-banner .go{margin-left:auto;font-size:22px;line-height:1}

  .map-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--teal-tint)}
  .map-wrap svg{display:block;width:100%;height:auto}
  .eta{text-align:center;padding:18px 0 4px}
  .eta .num{font-family:"Fraunces",Georgia,serif;font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .eta .lbl{color:var(--ink-soft);font-size:14px;margin-top:4px}

  .timeline{list-style:none;margin-top:8px}
  .timeline li{display:flex;gap:13px;padding:11px 0;font-size:15px;color:var(--ink-soft)}
  .timeline li .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
  .timeline li.done{color:var(--ink)}
  .timeline li.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
  .timeline li.done .tick svg{width:12px;height:12px}
  .timeline li.active{color:var(--ink);font-weight:600}
  .timeline li.active .tick{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-tint)}

  .pin-box{display:flex;gap:10px;justify-content:center;margin:16px 0 4px}
  .pin-box span{
    width:52px;height:62px;border-radius:12px;background:var(--surface-2);
    display:grid;place-items:center;font-size:28px;font-weight:700;
    font-family:"Fraunces",Georgia,serif;font-variant-numeric:tabular-nums;
  }

  .photo-ph{
    border:1px dashed var(--line);border-radius:14px;height:150px;
    display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:13.5px;background:var(--surface-2);
  }
  .photo-ph svg{width:30px;height:30px;opacity:.6}

  .success{text-align:center;padding:26px 8px}
  .success .big{width:74px;height:74px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
  .success .big svg{width:38px;height:38px}
  .success h1{margin-bottom:8px}

  .fam-note{background:var(--sun-tint);border-radius:14px;padding:14px 15px;font-size:14.5px;margin-bottom:18px;display:flex;gap:10px}
  .fam-note svg{width:20px;height:20px;flex:none;color:var(--sun);margin-top:1px}
  .toggle-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:4px 0}
  .switch{position:relative;width:52px;height:30px;flex:none}
  .switch input{opacity:0;width:100%;height:100%;cursor:pointer}
  .switch .slot{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
  .switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked + .slot{background:var(--teal)}
  .switch input:checked + .slot + .knob{transform:translateX(22px)}
  .alert-feed{list-style:none;margin-top:6px}
  .alert-feed li{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .alert-feed li:last-child{border-bottom:0}
  .alert-feed time{color:var(--ink-soft);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none;width:52px}

  .help-btn{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    border:1.5px solid var(--line);border-radius:14px;padding:17px;background:var(--surface);
    font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;margin-bottom:12px;
  }
  .help-btn .ico{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--teal-tint);color:var(--teal-deep)}
  .help-btn .ico svg{width:22px;height:22px}
  .help-btn small{display:block;font-weight:400;color:var(--ink-soft);font-size:13.5px}
  details{border-top:1px solid var(--line);padding:14px 0}
  details summary{font-weight:600;cursor:pointer;font-size:15.5px;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details p{color:var(--ink-soft);font-size:14.5px;margin-top:8px}

  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface)}
  .tabbar button{
    flex:1;border:0;background:transparent;cursor:pointer;
    padding:11px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--ink-soft);font-size:11.5px;font-weight:600;
  }
  .tabbar button svg{width:23px;height:23px}
  .tabbar button.on{color:var(--teal-deep)}

  .field-label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 9px}
  .review-line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
  .review-line:last-child{border-bottom:0}
  .review-line b{font-weight:600;text-align:right}
  .muted{color:var(--ink-soft);font-size:13.5px}
  :focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
</style>

<!-- ============ AUTH ============ -->
<div class="phone" id="auth">
  <span class="demo-chip">Demo</span>
  <div class="auth-body" id="authBody"></div>
</div>

<!-- ============ APP ============ -->
<div class="phone" id="app" hidden>
  <span class="demo-chip">Demo</span>
  <div class="topbar">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h4l2-3 3 8 2-4h6"/><circle cx="6" cy="15" r="2"/><circle cx="18" cy="15" r="2"/></svg>
    </div>
    <div class="brand">
      <b>Alisios Med</b>
      <span id="whoLabel">Cuenta</span>
    </div>
    <button class="icon-btn" id="logoutBtn">Salir</button>
  </div>

  <div class="screen" id="screen" aria-live="polite"></div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Inicio
    </button>
    <button data-tab="track">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11a7 7 0 0114 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Seguimiento
    </button>
    <button data-tab="family">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M4 19c0-3 2.4-5 5-5s5 2 5 5"/><path d="M15 14c2.4 0 5 1.6 5 5"/></svg>
      <span id="tabFamLabel">Familia</span>
    </button>
    <button data-tab="help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 013.9-2c1.4.9 1.2 2.6-.4 3.4-.9.5-1 .9-1 1.6"/><path d="M12 16.5h.01"/></svg>
      Ayuda
    </button>
  </nav>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SKEY = "alisios_session_v1";
const UKEY = "alisios_users_v1";
const KEY  = "alisios_state_v1";

/* ---------- example data (demo — not real patients) ---------- */
const CARED = { name:"Juana", town:"Betancuria", pharmacy:"Farmacia de Casillas del Ángel" };
const TREATMENTS = [
  { id:"enalapril", name:"Enalapril 10 mg", use:"tensión alta", daysLeft:3, cold:false },
  { id:"metformina", name:"Metformina 850 mg", use:"azúcar", daysLeft:6, cold:false },
  { id:"sintrom", name:"Sintrom 4 mg", use:"anticoagulante", daysLeft:2, cold:false, ctrl:true },
  { id:"insulina", name:"Insulina Lantus", use:"azúcar", daysLeft:9, cold:true }
];
const WINDOWS = [
  { id:"w1", label:"Hoy, 16:00 – 18:00", sub:"Hay dron disponible", ok:true },
  { id:"w2", label:"Mañana, 10:00 – 12:00", sub:"Hay dron disponible", ok:true },
  { id:"w3", label:"Mañana, 17:00 – 19:00", sub:"Viento fuerte previsto · se entregaría por carretera", ok:false }
];
const FLIGHT = {
  arriveMs: 58000,
  steps: [
    { key:"SOLICITADO", at:0,     text:"Pedido enviado" },
    { key:"RECIBIDO",   at:5000,  text:"Tu farmacia lo ha recibido" },
    { key:"VALIDADO",   at:12000, text:"El farmacéutico lo ha revisado y preparado" },
    { key:"HUB",        at:18000, text:"Paquete sellado y en el punto de salida" },
    { key:"MISION",     at:24000, text:"Dron asignado · ventana de viento correcta" },
    { key:"VUELO",      at:29000, text:"En vuelo hacia tu casa" },
    { key:"ENTREGA",    at:52000, text:"Llegando a tu punto de entrega" }
  ]
};

const I = {
  drone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h4l2-3 3 8 2-4h6"/><circle cx="6" cy="15" r="2"/><circle cx="18" cy="15" r="2"/></svg>',
  pill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(45 12 12)"/><path d="M8.5 8.5l7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-3 2a12 12 0 006 6l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 6a2 2 0 012-2z"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>'
};

/* ================= AUTH ================= */
function loadUsers(){
  try{ const u = JSON.parse(localStorage.getItem(UKEY)); if(Array.isArray(u) && u.length) return u; }catch(e){}
  return seedUsers();
}
function seedUsers(){
  const u = [
    { user:"juana", pass:"1234", role:"paciente", name:"Juana" },
    { user:"maria", pass:"1234", role:"familiar", name:"María", caring:"Juana" }
  ];
  try{ localStorage.setItem(UKEY, JSON.stringify(u)); }catch(e){}
  return u;
}
function saveUsers(u){ try{ localStorage.setItem(UKEY, JSON.stringify(u)); }catch(e){} }
let session = (()=>{ try{ return JSON.parse(localStorage.getItem(SKEY)); }catch(e){ return null; } })();

const authBody = $("#authBody");
let A = { view:"welcome", role:null };

function renderAuth(){
  $("#auth").hidden = false;
  $("#app").hidden = true;
  ({ welcome:authWelcome, login:authLogin, register:authRegister, done:authDone }[A.view] || authWelcome)();
}

function authWelcome(){
  authBody.innerHTML = `
    <div class="auth-hero" style="margin-top:24px">
      <div class="mark lg" aria-hidden="true">${I.drone}</div>
      <b class="wordmark">Alisios Med</b>
      <p>Tu farmacia de siempre, en la puerta de tu casa.</p>

let S = loadState();
function loadState(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r) return r; }catch(e){}
  return { tab:"home", order:null, history:[] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function resetDemo(){
  ["alisios_session_v1","alisios_users_v1","alisios_state_v1"].forEach(k=>{ try{localStorage.removeItem(k)}catch(e){} });
  location.reload();
}

function isFamily(){ return session && session.role === "familiar"; }
function patientName(){ return isFamily() ? (session.caring || CARED.name) : session.name; }
function famName(){ return isFamily() ? session.name : "María"; }

function elapsed(){ return S.order ? Date.now() - S.order.createdAt : 0; }
function currentStepIndex(){
  const e = elapsed(); let idx = 0;
  FLIGHT.steps.forEach((s,i)=>{ if(e >= s.at) idx = i; });
  return idx;
}
function phase(){
  if(!S.order) return "none";
  if(S.order.delivered) return "delivered";
  return elapsed() >= FLIGHT.arriveMs ? "arrived" : "enroute";
}

function bootApp(){
  $("#auth").hidden = true;
  $("#app").hidden = false;
  $("#whoLabel").textContent = isFamily()
    ? "Familiar de " + patientName()
    : "Cuenta de " + session.name;
  $("#tabFamLabel").textContent = isFamily() ? "Cuenta" : "Familia";
  if(S.order && !S.order.delivered) startTicker();
  render();
}

function render(){
  if(S.tab === "confirm-review"){
    document.querySelectorAll("#tabbar button").forEach(x=>x.classList.remove("on"));
    reviewScreen(); screenEl_scroll(); return;
  }
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  ({ home:homeScreen, track:trackScreen, family:familyScreen, help:helpScreen,
     order:orderScreen, confirm:confirmDeliveryScreen }[S.tab] || homeScreen)();
  screenEl_scroll();
}

function fmtClock(sec){ const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }

function trackScreen(){
  if(!S.order){
    screenEl.innerHTML = `
      <h1>Seguimiento</h1>
      <p class="lede">Ahora mismo no hay ningún pedido en camino.</p>
      <div class="btn-row"><button class="btn" data-go="order">Pedir medicación</button></div>`;
    return;
  }
  const ph = phase(), e = elapsed(), stepIdx = currentStepIndex();
  const legStart = FLIGHT.steps.find(s=>s.key==="VUELO").at;
  let prog = (e - legStart) / (FLIGHT.arriveMs - legStart);
  prog = Math.max(0, Math.min(1, prog));
  if(ph !== "enroute") prog = 1;
  const etaSec = Math.max(0, Math.ceil((FLIGHT.arriveMs - e)/1000));

  const steps = FLIGHT.steps.map((s,i)=>{
    const done = i < stepIdx || ph !== "enroute";
    const active = i === stepIdx && ph === "enroute";
    return `<li class="${done?"done":active?"active":""}"><span class="tick" aria-hidden="true">${done?I.check:""}</span>${s.text}</li>`;
  }).join("");

  let etaBlock;
  if(ph === "arrived"){
    etaBlock = `<div class="eta"><div class="num" aria-hidden="true">✓</div><div class="lbl">El dron ha llegado</div></div>
      <div class="btn-row"><button class="btn" data-go="confirm">Confirmar la recepción</button></div>`;
  } else if(ph === "delivered"){
    etaBlock = `<div class="eta"><div class="num" aria-hidden="true">✓</div><div class="lbl">Entregado y confirmado</div></div>`;
  } else {
    etaBlock = `<div class="eta"><div class="num">${fmtClock(etaSec)}</div><div class="lbl">para llegar a casa de ${esc(patientName())}</div></div>`;
  }

  screenEl.innerHTML = `
    <h1>Medicación en camino</h1>
    <p class="lede">Desde ${CARED.pharmacy} hasta ${CARED.town}.</p>
    <div class="map-wrap">${mapSVG(prog, ph)}</div>
    ${etaBlock}
    <ul class="timeline">${steps}</ul>
    <p class="muted">Si el viento no acompaña, se lleva por carretera el mismo día y se avisa aquí.</p>
  `;
}

function mapSVG(prog, ph){
  const p = cubicPoint(46,196, 110,150, 150,70, 250,58, prog);
  const ang = cubicAngle(46,196, 110,150, 150,70, 250,58, prog);
  return `
  <svg viewBox="0 0 300 232" role="img" aria-label="Mapa del recorrido del dron">
    <rect width="300" height="232" fill="var(--teal-tint)"/>
    <path d="M40 150 C 80 120 60 90 100 60 C 140 30 210 30 250 55 C 285 75 280 140 240 170 C 190 205 90 205 60 180 C 40 165 30 160 40 150 Z" fill="var(--surface)" opacity="0.55"/>
    <path d="M 46 196 C 110 150, 150 70, 250 58" fill="none" stroke="var(--teal-deep)" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
    <circle cx="46" cy="196" r="8" fill="var(--surface)" stroke="var(--teal-deep)" stroke-width="2.5"/>
    <text x="46" y="221" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="Hanken Grotesk, sans-serif" font-weight="600">Farmacia</text>
    <circle cx="250" cy="58" r="8" fill="${ph==='enroute'?'var(--surface)':'var(--ok)'}" stroke="var(--ok)" stroke-width="2.5"/>
    <text x="250" y="40" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="Hanken Grotesk, sans-serif" font-weight="600">Casa</text>
    <g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${ang.toFixed(1)})">
      <circle r="13" fill="var(--sun)" opacity="0.18"/>
      <path d="M-9 0h18 M-9 -4a4 4 0 010 8 M9 -4a4 4 0 000 8" stroke="var(--sun)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle r="3" fill="var(--sun)"/>
    </g>
  </svg>`;
}
function cubicPoint(x0,y0,x1,y1,x2,y2,x3,y3,t){
  const u=1-t;
  return { x:u*u*u*x0+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x3, y:u*u*u*y0+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y3 };
}
function cubicAngle(x0,y0,x1,y1,x2,y2,x3,y3,t){
  const a=cubicPoint(x0,y0,x1,y1,x2,y2,x3,y3,Math.max(0,t-0.01));
  const b=cubicPoint(x0,y0,x1,y1,x2,y2,x3,y3,Math.min(1,t+0.01));
  return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
}

/* ---------- ticker ---------- */
let timer = null;
function startTicker(){
  clearInterval(timer);
  timer = setInterval(()=>{
    if(!S.order || S.order.delivered){ clearInterval(timer); return; }
    if(["track","home","family"].includes(S.tab)) render();
  }, 1000);
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const go = e.target.closest("[data-go]");
  if(!go || $("#app").hidden) return;
  const d = go.dataset.go;
  if(d === "order"){ draft.urgent=false; S.tab="order"; render(); }
  else if(d === "order-urgent"){ draft.urgent=true; draft.items=[]; S.tab="order"; render(); }
  else if(d === "confirm"){ S.tab="confirm"; render(); }
  else { S.tab = d; render(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("live-banner")) e.target.click();
});
$("#tabbar").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  S.tab = b.dataset.tab; save(); render();
});

/* ---------- boot ---------- */
if(session && session.user){ bootApp(); }
else { renderAuth(); }
</script>
